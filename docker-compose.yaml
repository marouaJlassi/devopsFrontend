services:
  frontend:
    build: .
    ports:
      - '4200:8082'
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - --nginx.scrape-uri=http://frontend:8082/nginx_status
    ports:
      - '9113:9113'
    depends_on:
      - frontend
    restart: unless-stopped